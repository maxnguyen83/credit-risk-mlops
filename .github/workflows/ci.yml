name: CI

# Runs on ubuntu-latest, NOT on a self-hosted runner.
#
# Labs 04 and 05 used a self-hosted runner on a team member's laptop, and it
# worked right up until the laptop was shut. Anyone opening this repository at
# 11pm has to see a current build status, and a badge that depends on somebody's
# machine being awake is grey most of the time. The cost of this decision is
# that nothing here is tested on ARM64, which is what the team actually develops
# on; that is recorded in docs/adr/0008.
#
# Deployment is the one job that does run on a self-hosted runner, because its
# target is the machine running the stack: deploy.yml starts when this workflow
# succeeds on a push to main, and finds it by its name, "CI". Renaming this
# workflow disconnects deployment.

on:
  push:
    # Branches only. GitHub ORs the ref filters rather than intersecting them,
    # so adding `tags-ignore: ["v*"]` here WIDENED the trigger -- it made CI run
    # on every pushed tag that was not a release tag. `branches` on its own
    # already excludes all tags; release.yml is what tags run.
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: credit-risk-api

jobs:
  # ----------------------------------------------------------------- lint
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev tooling
        # Only the dev extras: ruff does not need lightgbm, and installing the
        # full dependency set here would add two minutes to a 20-second job.
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.8.4"

      - name: ruff check
        # `.` rather than an explicit directory list: ruff errors on a path that
        # does not exist, and the directory list changes as tracks land. Files
        # ignored by git are ignored here too.
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

  # ------------------------------------------------------------ typecheck
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tooling
        # mypy needs the real dependencies installed to resolve third-party
        # types; stubbing them out would make the check pass on code that does
        # not import.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: mypy
        # Configuration (packages, mypy_path) lives in pyproject.toml so this
        # command is identical to `make typecheck` on a laptop.
        run: mypy

  # ---------------------------------------------------------------- test
  test:
    name: test + coverage (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: typecheck
    strategy:
      # Both interpreters the system actually runs on. The serving image is
      # python:3.12-slim; the project virtualenv inside the Airflow image is
      # 3.11, because that is what apache/airflow:2.8.4-python3.11 ships (see
      # ADR 0006). Testing one of them would leave the other unverified, and a
      # version-specific failure would surface as a container that works on a
      # laptop and not in the DAG.
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: pytest
        # `not needs_data` because the dataset is downloaded in the data-quality
        # job, and `not slow` because training a model or standing up compose
        # belongs in their own jobs. The 80% gate is enforced from the first
        # commit rather than bolted on at the end, which is the only way it ever
        # actually gets met.
        run: |
          pytest -m "not slow and not needs_data" \
            --cov=src/credit_risk \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Name it per interpreter: two matrix legs uploading the same artifact
          # name is an error on actions/upload-artifact v4.
          name: coverage-xml-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 14

  # ---------------------------------------------------------- model tests
  model:
    name: model tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Model quality, direction and invariance
        # `slow` keeps these off the fast matrix above, not out of CI. They are
        # the tests that turn a model regressed to noise into a red build: the
        # PR-AUC and ROC-AUC floors, the Brier bound, monotonicity in
        # delinquency, protected-attribute invariance, and the training run
        # that has to register through the gate. About 20 seconds; no dataset
        # needed, because they train on a synthetic fixture. The one test that
        # does need the real batch runs in `data_quality`, after the download.
        run: pytest tests/model -m "not needs_data" -v

  # -------------------------------------------------------- data quality
  data_quality:
    name: data quality
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache the UCI download
        # 5.5 MB from archive.ics.uci.edu on every run is rude to a public
        # archive and makes CI fail whenever they have a bad day. The key is
        # tied to schema.py because that is where the URL and the expected shape
        # live: change the source, get a fresh download.
        uses: actions/cache@v4
        with:
          path: data/raw
          key: uci-350-${{ hashFiles('src/credit_risk/schema.py') }}
          restore-keys: uci-350-

      - name: Download the dataset if it is not cached
        run: python -m credit_risk.data.download

      - name: Clean and split it into the six batches
        # The processed splits are what training reads. Without them the
        # split checks and the real-batch model test below skip themselves.
        run: python -m credit_risk.data.split

      - name: Run the data-quality suite
        # These assert measured facts -- 30,000 x 25, zero nulls, the
        # undocumented EDUCATION codes 0/5/6 -- so a silent change at the source
        # fails here rather than surfacing as a strange model six steps later.
        run: pytest tests/data_quality -m "not slow" -v

      - name: Model targets on the real held-out batch
        # The PR-AUC and ROC-AUC floors again, this time on batch 5 of the real
        # data rather than the synthetic fixture the `model` job uses.
        run: pytest tests/model -m "needs_data" -v

  # --------------------------------------------------------- alert rules
  alert_rules:
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: promtool test rules
        # The smoke job proves Prometheus LOADS every rule; this proves what the
        # expressions DO. FairnessGapExceeded never fired in any demo scenario,
        # so synthetic series are the only evidence it can, and the idle case
        # pins the fix that stopped HighRiskShareShift firing on an API with no
        # traffic. Same image and tag as docker-compose.yml, so the promtool
        # here evaluates PromQL exactly as the deployed Prometheus does.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/monitoring/prometheus:/p:ro" \
            --entrypoint promtool \
            prom/prometheus:v2.55.1 \
            test rules /p/tests/rules_test.yml

      - name: alertmanager configs and routes (amtool)
        # Both Alertmanager configs load, share one routing tree, and send a
        # pipeline failure, a critical and a warning alert to the receivers
        # meant for them; the start-up switch falls back to the no-op config on
        # anything short of a complete pair of Telegram secrets. Same image and
        # tag as docker-compose.yml, so amtool parses YAML as the deployed
        # Alertmanager does.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}/monitoring/alertmanager:/etc/alertmanager:ro" \
            --entrypoint /bin/sh \
            prom/alertmanager:v0.27.0 \
            /etc/alertmanager/tests/test_config.sh

  # ---------------------------------------------------- dependency audit
  audit:
    name: dependency audit (report-only)
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      outcome: ${{ steps.audit.outcome }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install pip-audit
        run: python -m pip install --upgrade pip "pip-audit==2.10.1"

      - name: pip-audit against the pinned requirements
        id: audit
        # REPORT-ONLY, and on purpose rather than by omission. The pinned set
        # has known advisories today -- mlflow 2.19.0 and starlette 0.41.3
        # account for most of them -- and the fixed releases are major
        # upgrades (mlflow 3.x, a newer FastAPI) that need their own change
        # and a full stack run, not a dependency bump slipped into CI. Until
        # then this step lists every advisory in the run summary on every
        # push, and the `summary` table shows whether any were found. Turning
        # it into a gate is deleting `continue-on-error`.
        continue-on-error: true
        shell: bash
        run: |
          pip-audit -r requirements.txt --progress-spinner off --desc off --format markdown \
            | tee -a "$GITHUB_STEP_SUMMARY"

  # --------------------------------------------------------------- build
  build:
    name: build image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report image size
        # A multi-stage build that quietly stops being multi-stage shows up here
        # as a number that tripled, and nowhere else.
        run: docker image ls "${{ env.IMAGE_NAME }}:${{ github.sha }}"

  # --------------------------------------------------------------- smoke
  smoke:
    name: smoke (compose)
    runs-on: ubuntu-latest
    needs: [build, data_quality]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env from the example
        # .env is gitignored. The example holds placeholders only, which is
        # exactly what CI needs -- no secret is required to bring the stack up.
        run: cp .env.example .env

      - name: docker compose up
        run: docker compose up -d --build

      - name: Wait and smoke
        # SMOKE_ALLOW_DEGRADED=1: nothing in this pipeline trains and registers a
        # model, and doing so inside the smoke job would turn a 2-minute check
        # into a 10-minute one. What this still proves is everything the job is
        # for -- the stack composes, the API serves, and every metric the alert
        # rules query is declared. Run locally without the flag (`make smoke`)
        # and a missing model is a hard failure, which is how the demo runs it.
        env:
          BASE_URL: http://localhost:18000
          SMOKE_WAIT_SECONDS: "180"
          SMOKE_ALLOW_DEGRADED: "1"
        run: bash ./scripts/smoke.sh

      - name: Prometheus loaded every alert rule
        # The rule files are mounted, not baked in, so a typo in a path is
        # invisible until an alert fails to fire during an incident.
        #
        # The expected count is DERIVED from the files rather than hard-coded.
        # A literal here is a second place to update every time somebody adds a
        # rule, and the version of this step that hard-coded 8 was already wrong
        # by one -- which would have turned every future CI run red for a reason
        # that has nothing to do with the change being tested.
        run: |
          expected=$(grep -hc '^[[:space:]]*- alert:' monitoring/prometheus/alerts/*.yml |
            paste -sd+ - | bc)
          loaded=$(curl -fsS http://localhost:19090/api/v1/rules |
            python3 -c 'import json,sys; g=json.load(sys.stdin)["data"]["groups"]; print(sum(1 for x in g for r in x["rules"] if r["type"]=="alerting"))')
          echo "alerting rules declared: ${expected}, loaded by Prometheus: ${loaded}"
          test "${loaded}" -eq "${expected}"

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        # always(): a leaked stack on a runner is nobody's problem, but a leaked
        # stack on a self-hosted runner is everybody's, and this workflow should
        # not depend on which kind it is running on.
        if: always()
        run: docker compose down -v --remove-orphans

  # ------------------------------------------------------------- summary
  summary:
    name: summary
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, model, data_quality, alert_rules, audit, build, smoke]
    if: always()
    steps:
      - name: Write the job table
        run: |
          {
            echo "## CI result"
            echo
            echo "| gate | result |"
            echo "|---|---|"
            echo "| lint (ruff check + format) | ${{ needs.lint.result }} |"
            echo "| typecheck (mypy) | ${{ needs.typecheck.result }} |"
            echo "| test + coverage >= 80% | ${{ needs.test.result }} |"
            echo "| model tests | ${{ needs.model.result }} |"
            echo "| data quality | ${{ needs.data_quality.result }} |"
            echo "| alert rules (promtool) | ${{ needs.alert_rules.result }} |"
            echo "| dependency audit (report-only; failure = advisories found) | ${{ needs.audit.outputs.outcome }} |"
            echo "| docker build | ${{ needs.build.result }} |"
            echo "| smoke (compose) | ${{ needs.smoke.result }} |"
            echo
            echo "Commit \`${GITHUB_SHA::7}\` on \`${GITHUB_REF_NAME}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any gate failed
        # `needs` with `if: always()` means this job runs even when an upstream
        # job failed, so it has to re-assert the verdict itself. Without this the
        # summary job is green and the workflow looks green with it.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One or more gates failed — see the table above."
          exit 1
