# Weekly update PRs for the two places this repository pins versions.
#
# pip: pyproject.toml is the source of truth and requirements.txt is generated
# from it (scripts/gen_requirements.py). A Dependabot PR that bumps a pin in one
# needs the other regenerated before it merges, and like every PR it has to pass
# CI -- including the `dependency audit` job that motivated this file.
#
# Major versions are ignored here: a major bump (mlflow 2 -> 3 above all) changes
# the registry API this system is built on and is planned as its own piece of
# work, not merged from a bot PR.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # MLflow 2.19 imports FallbackAsyncAdaptedQueuePool, which SQLAlchemy 2.1
      # removed (see the pin in pyproject.toml). Lift this with the MLflow upgrade.
      - dependency-name: "sqlalchemy"
        versions: [">=2.1"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
